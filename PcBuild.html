<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PC Build — каталог комплектующих для сборки ПК</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --blue: #1a6dff;
        --blue-d: #0d4fd6;
        --dark: #0f1420;
        --dark2: #1b2334;
        --bg: #f5f6f8;
        --border: #e4e7ee;
        --text: #151922;
        --muted: #7a8194;
        --green: #12a150;
        --red: #e5484d;
        --radius: 12px;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
        font-size: 14px;
      }
      input,
      select {
        font-family: inherit;
        font-size: 14px;
        outline: none;
      }
      img {
        max-width: 100%;
      }

      /* ---------- HEADER ---------- */
      .header {
        background: var(--dark);
        color: #fff;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .header-inner {
        max-width: 1320px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 0 20px;
        height: 64px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 700;
        font-size: 17px;
        white-space: nowrap;
      }
      .logo-mark {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: linear-gradient(135deg, #4d8dff, #1a6dff);
        display: grid;
        place-items: center;
        font-size: 15px;
        box-shadow: 0 2px 8px rgba(26, 109, 255, 0.5);
      }
      .nav {
        display: flex;
        gap: 22px;
      }
      .nav a {
        color: #c2cbdd;
        padding: 22px 0;
        border-bottom: 2px solid transparent;
        transition: 0.15s;
        white-space: nowrap;
      }
      .nav a:hover {
        color: #fff;
      }
      .nav a.active {
        color: #fff;
        border-bottom-color: var(--blue);
      }
      .search {
        flex: 1;
        max-width: 400px;
        margin-left: auto;
      }
      .search input {
        width: 100%;
        height: 38px;
        border-radius: 9px;
        border: 1px solid #2b3446;
        background: #1b2334;
        color: #fff;
        padding: 0 14px;
      }
      .search input::placeholder {
        color: #76809a;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-left: auto;
      }
      .h-action {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #c2cbdd;
        font-size: 13px;
        transition: 0.15s;
      }
      .h-action:hover {
        color: #fff;
      }
      .cart-badge {
        position: relative;
      }
      .cart-badge span {
        position: absolute;
        top: -8px;
        right: -10px;
        background: var(--blue);
        color: #fff;
        font-size: 11px;
        min-width: 18px;
        height: 18px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        padding: 0 5px;
        font-weight: 600;
      }

      /* ---------- LAYOUT ---------- */
      .wrap {
        max-width: 1320px;
        margin: 0 auto;
        padding: 0 20px;
      }
      .page {
        display: none;
        padding: 26px 0 60px;
      }
      .page.active {
        display: block;
      }
      .section-title {
        font-size: 22px;
        font-weight: 700;
        margin: 34px 0 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .section-title:first-child {
        margin-top: 0;
      }
      .section-title .link {
        font-size: 14px;
        font-weight: 500;
        color: var(--blue);
      }

      /* ---------- BUTTONS ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 40px;
        padding: 0 18px;
        border-radius: 9px;
        font-weight: 600;
        font-size: 14px;
        transition: 0.15s;
        white-space: nowrap;
      }
      .btn-primary {
        background: var(--blue);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--blue-d);
      }
      .btn-outline {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text);
      }
      .btn-outline:hover {
        border-color: var(--blue);
        color: var(--blue);
      }
      .btn-ghost {
        color: var(--blue);
        background: #eef4ff;
      }
      .btn-ghost:hover {
        background: #e0ebff;
      }
      .btn-danger {
        color: var(--red);
        background: #fdeaea;
      }
      .btn-danger:hover {
        background: #fbdcdc;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn-sm {
        height: 32px;
        padding: 0 12px;
        font-size: 13px;
        border-radius: 8px;
      }
      .btn-block {
        width: 100%;
      }

      /* ---------- HERO ---------- */
      .hero {
        background: linear-gradient(
          115deg,
          #0b1220 0%,
          #132a5c 60%,
          #1a4ea8 100%
        );
        border-radius: 18px;
        color: #fff;
        padding: 54px 56px;
        position: relative;
        overflow: hidden;
        margin-top: 8px;
      }
      .hero:after {
        content: "";
        position: absolute;
        right: -60px;
        top: -60px;
        width: 420px;
        height: 420px;
        background: radial-gradient(
          circle,
          rgba(77, 141, 255, 0.45),
          transparent 65%
        );
      }
      .hero h1 {
        font-size: 38px;
        line-height: 1.15;
        font-weight: 800;
        max-width: 560px;
        position: relative;
        z-index: 1;
      }
      .hero p {
        margin: 16px 0 26px;
        color: #b9c6e0;
        max-width: 480px;
        position: relative;
        z-index: 1;
      }
      .hero .btn {
        position: relative;
        z-index: 1;
        height: 46px;
        padding: 0 28px;
        font-size: 15px;
      }
      .hero-feats {
        display: flex;
        gap: 34px;
        margin-top: 38px;
        position: relative;
        z-index: 1;
        flex-wrap: wrap;
      }
      .hero-feat {
        display: flex;
        gap: 11px;
        align-items: flex-start;
        max-width: 220px;
      }
      .hero-feat .ic {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: rgba(77, 141, 255, 0.2);
        display: grid;
        place-items: center;
        font-size: 16px;
        flex: none;
      }
      .hero-feat b {
        display: block;
        font-size: 13.5px;
        margin-bottom: 2px;
      }
      .hero-feat small {
        color: #a9b7d4;
        font-size: 12px;
        line-height: 1.35;
      }

      /* ---------- CATEGORY TILES ---------- */
      .cat-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 14px;
      }
      .cat-tile {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px 10px;
        text-align: center;
        transition: 0.15s;
        cursor: pointer;
      }
      .cat-tile:hover {
        border-color: var(--blue);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(26, 109, 255, 0.12);
      }
      .cat-tile .ic {
        font-size: 26px;
        display: block;
        margin-bottom: 8px;
      }
      .cat-tile span {
        font-size: 12.5px;
        color: var(--text);
        line-height: 1.3;
        display: block;
      }

      /* ---------- PRODUCT GRID ---------- */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(206px, 1fr));
        gap: 16px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        display: flex;
        flex-direction: column;
        position: relative;
        transition: 0.15s;
      }
      .card:hover {
        border-color: #c9d4ea;
        box-shadow: 0 8px 24px rgba(20, 40, 80, 0.08);
      }
      .card-img {
        height: 130px;
        border-radius: 10px;
        background: linear-gradient(140deg, #f2f5fb, #e6ecf7);
        display: grid;
        place-items: center;
        font-size: 46px;
        margin-bottom: 12px;
        cursor: pointer;
      }
      .card-brand {
        font-size: 11.5px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-bottom: 3px;
      }
      .card-name {
        font-weight: 600;
        font-size: 13.5px;
        line-height: 1.35;
        margin-bottom: 7px;
        min-height: 37px;
        cursor: pointer;
      }
      .card-name:hover {
        color: var(--blue);
      }
      .card-rating {
        font-size: 12px;
        color: #f5a623;
        margin-bottom: 8px;
      }
      .card-rating i {
        color: var(--muted);
        font-style: normal;
      }
      .card-price {
        font-size: 17px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .card-stock {
        font-size: 12px;
        margin-bottom: 11px;
      }
      .in-stock {
        color: var(--green);
      }
      .no-stock {
        color: var(--red);
      }
      .card .btn {
        margin-top: auto;
      }
      .card-fav {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 16px;
        color: #c3cbdb;
        z-index: 2;
      }
      .card-fav:hover,
      .card-fav.on {
        color: var(--red);
      }

      /* ---------- CATALOG LAYOUT ---------- */
      .cat-layout {
        display: grid;
        grid-template-columns: 262px 1fr;
        gap: 22px;
        align-items: start;
      }
      .sidebar {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        position: sticky;
        top: 88px;
      }
      .filter-block {
        border-bottom: 1px solid var(--border);
        padding-bottom: 16px;
        margin-bottom: 16px;
      }
      .filter-block:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
      }
      .filter-title {
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 11px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 5px 0;
        cursor: pointer;
        font-size: 13.5px;
        color: #3c4356;
      }
      .check input {
        width: 16px;
        height: 16px;
        accent-color: var(--blue);
        cursor: pointer;
      }
      .check span.count {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
      }
      .price-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .price-row input {
        width: 100%;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0 10px;
      }
      .price-row input:focus {
        border-color: var(--blue);
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        gap: 14px;
        flex-wrap: wrap;
      }
      .toolbar .count {
        color: var(--muted);
        font-size: 13.5px;
      }
      .toolbar select {
        height: 38px;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 0 12px;
        background: #fff;
        cursor: pointer;
      }
      .empty {
        background: #fff;
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        padding: 56px;
        text-align: center;
        color: var(--muted);
      }

      /* ---------- BUILD ---------- */
      .build-layout {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 22px;
        align-items: start;
      }
      .slot {
        display: flex;
        align-items: center;
        gap: 14px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px;
        margin-bottom: 10px;
      }
      .slot-ic {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        background: #f1f4fa;
        display: grid;
        place-items: center;
        font-size: 19px;
        flex: none;
      }
      .slot-body {
        flex: 1;
        min-width: 0;
      }
      .slot-label {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 2px;
      }
      .slot-name {
        font-weight: 600;
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .slot-name.empty-name {
        color: var(--muted);
        font-weight: 400;
      }
      .slot-price {
        font-weight: 700;
        white-space: nowrap;
      }
      .summary {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        position: sticky;
        top: 88px;
      }
      .summary-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        font-size: 13.5px;
        color: #4a5164;
      }
      .summary-total {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-top: 1px solid var(--border);
        margin-top: 10px;
        padding-top: 14px;
        font-size: 15px;
      }
      .summary-total b {
        font-size: 24px;
        font-weight: 800;
      }
      .compat {
        margin-top: 16px;
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 13px;
      }
      .compat.ok {
        background: #e9f8f0;
        color: #0b7a3d;
      }
      .compat.bad {
        background: #fdecec;
        color: #b3261e;
      }
      .compat ul {
        margin: 8px 0 0 16px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .compat li {
        line-height: 1.4;
      }

      /* ---------- CART ---------- */
      .cart-layout {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 22px;
        align-items: start;
      }
      .cart-item {
        display: flex;
        gap: 16px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 12px;
        align-items: center;
      }
      .cart-item .thumb {
        width: 80px;
        height: 80px;
        border-radius: 10px;
        background: #f1f4fa;
        display: grid;
        place-items: center;
        font-size: 32px;
        flex: none;
      }
      .cart-item .info {
        flex: 1;
        min-width: 0;
      }
      .cart-item .info b {
        display: block;
        font-size: 14px;
        margin-bottom: 3px;
      }
      .cart-item .info small {
        color: var(--muted);
        font-size: 12.5px;
      }
      .qty {
        display: flex;
        align-items: center;
        gap: 2px;
        border: 1px solid var(--border);
        border-radius: 9px;
        overflow: hidden;
      }
      .qty button {
        width: 32px;
        height: 34px;
        font-size: 16px;
        color: #4a5164;
      }
      .qty button:hover {
        background: #f2f5fa;
      }
      .qty span {
        width: 36px;
        text-align: center;
        font-weight: 600;
      }
      .cart-item .sum {
        font-weight: 700;
        font-size: 16px;
        width: 110px;
        text-align: right;
      }

      /* ---------- MODAL ---------- */
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(10, 16, 28, 0.55);
        backdrop-filter: blur(3px);
        z-index: 300;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal.active {
        display: flex;
      }
      .modal-box {
        background: #fff;
        border-radius: 16px;
        max-width: 900px;
        width: 100%;
        max-height: 88vh;
        overflow: auto;
        position: relative;
        padding: 28px;
      }
      .modal-close {
        position: absolute;
        top: 14px;
        right: 16px;
        font-size: 26px;
        color: var(--muted);
        line-height: 1;
        z-index: 2;
      }
      .modal-close:hover {
        color: var(--text);
      }
      .picker-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 18px;
      }
      .picker-row {
        display: flex;
        align-items: center;
        gap: 14px;
        border: 1px solid var(--border);
        border-radius: 11px;
        padding: 12px 14px;
        transition: 0.15s;
      }
      .picker-row:hover {
        border-color: var(--blue);
        background: #fafbff;
      }
      .picker-row.disabled {
        opacity: 0.5;
        background: #fafafa;
      }
      .picker-row .ic {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: #f1f4fa;
        display: grid;
        place-items: center;
        font-size: 20px;
        flex: none;
      }
      .picker-row .txt {
        flex: 1;
        min-width: 0;
      }
      .picker-row .txt b {
        display: block;
        font-size: 13.5px;
      }
      .picker-row .txt small {
        color: var(--muted);
        font-size: 12px;
      }
      .picker-row .pr {
        font-weight: 700;
        white-space: nowrap;
      }

      /* ---------- PRODUCT DETAIL ---------- */
      .pd {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 32px;
      }
      .pd-img {
        height: 300px;
        border-radius: 14px;
        background: linear-gradient(140deg, #f2f5fb, #e6ecf7);
        display: grid;
        place-items: center;
        font-size: 110px;
      }
      .pd h2 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .pd .rating {
        color: #f5a623;
        font-size: 13.5px;
        margin-bottom: 14px;
      }
      .pd .rating i {
        color: var(--muted);
        font-style: normal;
      }
      .pd .price {
        font-size: 32px;
        font-weight: 800;
        margin-bottom: 6px;
      }
      .pd .actions {
        display: flex;
        gap: 12px;
        margin: 20px 0;
      }
      .spec-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 22px;
        font-size: 13.5px;
      }
      .spec-table td {
        padding: 9px 0;
        border-bottom: 1px solid var(--border);
      }
      .spec-table td:first-child {
        color: var(--muted);
        width: 45%;
      }
      .tabs {
        display: flex;
        gap: 26px;
        border-bottom: 1px solid var(--border);
        margin-top: 26px;
      }
      .tabs button {
        padding: 12px 0;
        font-weight: 600;
        color: var(--muted);
        border-bottom: 2px solid transparent;
      }
      .tabs button.active {
        color: var(--blue);
        border-bottom-color: var(--blue);
      }

      /* ---------- AUTH ---------- */
      .auth-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        max-width: 900px;
        margin: 30px auto;
      }
      .auth-side {
        background: linear-gradient(150deg, #0b1220, #173a7a);
        color: #fff;
        padding: 46px 40px;
      }
      .auth-side h2 {
        font-size: 27px;
        font-weight: 800;
        line-height: 1.2;
        margin-bottom: 14px;
      }
      .auth-side p {
        color: #b0bfdd;
        font-size: 13.5px;
        margin-bottom: 26px;
      }
      .auth-feat {
        display: flex;
        gap: 11px;
        margin-bottom: 18px;
        align-items: flex-start;
      }
      .auth-feat .ic {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        background: rgba(77, 141, 255, 0.22);
        display: grid;
        place-items: center;
        flex: none;
      }
      .auth-feat b {
        display: block;
        font-size: 13.5px;
      }
      .auth-feat small {
        color: #a5b3d0;
        font-size: 12px;
      }
      .auth-form {
        padding: 40px 44px;
      }
      .auth-form h3 {
        font-size: 21px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .auth-form > .sub {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 22px;
      }
      .field {
        margin-bottom: 15px;
      }
      .field label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .field input {
        width: 100%;
        height: 42px;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 0 13px;
        background: #fafbfd;
      }
      .field input:focus {
        border-color: var(--blue);
        background: #fff;
      }
      .field .err {
        color: var(--red);
        font-size: 12px;
        margin-top: 5px;
        display: none;
      }
      .field.invalid input {
        border-color: var(--red);

          price: 3490,
          stock: 14,
          sockets: ["AM4", "LGA1700"],
          tdp: 150,
          ctype: "Воздушное",
          rating: 4.7,
          reviews: 121,
          desc: "Эффективный и недорогой кулер для игровых процессоров.",
        },
        {
          id: "cl-4",
          cat: "cooling",
          name: "Deepcool LE500",
          brand: "Deepcool",
          price: 5490,
          stock: 8,
          sockets: ["AM4", "LGA1700"],
          tdp: 180,
          ctype: "СЖО 240 мм",
          rating: 4.6,
          reviews: 63,
          desc: "Компактная система жидкостного охлаждения с подсветкой.",
        },
      ];

      const byId = (id) => COMPONENTS.find((c) => c.id === id);
      const money = (n) => new Intl.NumberFormat("ru-RU").format(n) + " ₽";
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[m],
        );

      /* ---------------------------- ХРАНИЛИЩЕ -------------------------------- */
      const LS = {
        get(k, def) {
          try {
            const v = localStorage.getItem(k);
            return v ? JSON.parse(v) : def;
          } catch (e) {
            return def;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, JSON.stringify(v));
          } catch (e) {}
        },
      };

      const state = {
        page: "home",
        filters: {
          cats: [],
          brands: [],
          min: null,
          max: null,
          inStock: false,
          q: "",
          sort: "popular",
        },
        cart: LS.get("pcb_cart", []),
        build: LS.get("pcb_build", {}),
        users: LS.get("pcb_users", []),
        user: LS.get("pcb_user", null),
        favorites: LS.get("pcb_fav", []),
      };

      function saveCart() {
        LS.set("pcb_cart", state.cart);
      }
      function saveBuild() {
        LS.set("pcb_build", state.build);
      }
      function saveUsers() {
        LS.set("pcb_users", state.users);
      }
      function saveUser() {
        LS.set("pcb_user", state.user);
      }
      function saveFav() {
        LS.set("pcb_fav", state.favorites);
      }

      /* ------------------------------ УТИЛИТЫ -------------------------------- */
      function toast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(t._tm);
        t._tm = setTimeout(() => t.classList.remove("show"), 2400);
      }

      function openModal(html) {
        document.getElementById("modalBody").innerHTML = html;
        document.getElementById("modal").classList.add("active");
      }
      function closeModal() {
        document.getElementById("modal").classList.remove("active");
        document.getElementById("modalBody").innerHTML = "";
      }
      document.getElementById("modal").addEventListener("click", (e) => {
        if (e.target.id === "modal") closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      function stars(rating) {
        const full = Math.round(rating);
        return "★".repeat(full) + "☆".repeat(5 - full);
      }

      /* --------------------------- СОВМЕСТИМОСТЬ ----------------------------- */
      const FF_ORDER = { "Mini-ITX": 0, mATX: 1, ATX: 2 };

      function formFactorFits(caseFF, mbFF) {
        return (FF_ORDER[caseFF] ?? -1) >= (FF_ORDER[mbFF] ?? 99);
      }

      function buildParts() {
        const b = state.build;
        const out = {};
        for (const k in b) {
          if (b[k]) out[k] = byId(b[k]);
        }
        return out;
      }

      function totalTdp() {
        const p = buildParts();
        let t = 0;
        if (p.cpu) t += p.cpu.tdp;
        if (p.gpu) t += p.gpu.tdp;
        t += 60; // материнская плата, накопители, вентиляторы
        return t;
      }

      function recommendedPsu() {
        const need = Math.ceil((totalTdp() * 1.3) / 50) * 50;
        return Math.max(need, 400);
      }

      function checkCompatibility() {
        const p = buildParts();
        const issues = [];

        if (p.cpu && p.motherboard && p.cpu.socket !== p.motherboard.socket)
          issues.push(
            `Сокет процессора (${p.cpu.socket}) не совпадает с сокетом материнской платы (${p.motherboard.socket}).`,
          );

        if (
          p.ram &&
          p.motherboard &&
          !p.motherboard.ramType.includes(p.ram.ramType)
        )
          issues.push(
            `Материнская плата поддерживает ${p.motherboard.ramType.join("/")}, а память — ${p.ram.ramType}.`,
          );

        if (
          p.motherboard &&
          p.case &&
          !formFactorFits(p.case.formFactor, p.motherboard.formFactor)
        )
          issues.push(
            `Форм-фактор платы ${p.motherboard.formFactor} не помещается в корпус ${p.case.formFactor}.`,
          );

        if (p.cooling && p.cpu && !p.cooling.sockets.includes(p.cpu.socket))
          issues.push(`Кулер не поддерживает сокет ${p.cpu.socket}.`);

        if (p.cooling && p.cpu && p.cooling.tdp < p.cpu.tdp)
          issues.push(
            `Кулер рассчитан на ${p.cooling.tdp} Вт, а процессор выделяет ${p.cpu.tdp} Вт.`,
          );

        if (p.gpu && p.case && p.case.maxGpu && p.gpu.length > p.case.maxGpu)
          issues.push(
            `Длина видеокарты ${p.gpu.length} мм превышает допустимые ${p.case.maxGpu} мм.`,
          );

        if (p.psu && (p.cpu || p.gpu)) {
          const need = recommendedPsu();
          if (p.psu.watt < need)
            issues.push(
              `Мощности блока питания (${p.psu.watt} Вт) недостаточно: рекомендуется не менее ${need} Вт.`,
            );
        }

        return issues;
      }

      /* ------------------------------ КОРЗИНА -------------------------------- */
      function cartQty() {
        return state.cart.reduce((s, i) => s + i.qty, 0);
      }
      function cartTotal() {
        return state.cart.reduce(
          (s, i) => s + (byId(i.id)?.price || 0) * i.qty,
          0,
        );
      }

      function addToCart(id, qty = 1) {
        const comp = byId(id);
        if (!comp) return;
        if (comp.stock === 0) {
          toast("Товара нет в наличии");
          return;
        }
        const item = state.cart.find((i) => i.id === id);
        if (item) {
          if (item.qty + qty > comp.stock) {
            toast("Больше нет на складе");
            return;
          }
          item.qty += qty;
        } else {
          state.cart.push({ id, qty });
        }
        saveCart();
        updateCartBadge();
        toast(`«${comp.name}» добавлен в корзину`);
        if (state.page === "cart") render();
      }

      function setQty(id, qty) {
        const item = state.cart.find((i) => i.id === id);
        if (!item) return;
        const comp = byId(id);
        if (qty <= 0) {
          state.cart = state.cart.filter((i) => i.id !== id);
        } else {
          item.qty = Math.min(qty, comp.stock);
        }
        saveCart();
        updateCartBadge();
        if (state.page === "cart") render();
      }

      function removeFromCart(id) {
        state.cart = state.cart.filter((i) => i.id !== id);
        saveCart();
        updateCartBadge();
        if (state.page === "cart") render();
        toast("Товар удалён из корзины");
      }

      function updateCartBadge() {
        document.getElementById("cartCount").textContent = cartQty();
      }

      /* ------------------------------- СБОРКА -------------------------------- */
      function setBuildPart(cat, id) {
        if (id === null) delete state.build[cat];
        else state.build[cat] = id;
        saveBuild();
        render();
        closeModal();
      }

      function clearBuild() {
        state.build = {};
        saveBuild();
        render();
        toast("Сборка сброшена");
      }

      /* ------------------------------ ФИЛЬТРЫ -------------------------------- */
      function filtered() {
        const f = state.filters;
        let list = COMPONENTS.slice();

        if (f.cats.length) list = list.filter((c) => f.cats.includes(c.cat));
        if (f.brands.length)
          list = list.filter((c) => f.brands.includes(c.brand));
        if (f.min != null && f.min !== "")
          list = list.filter((c) => c.price >= +f.min);
        if (f.max != null && f.max !== "")
          list = list.filter((c) => c.price <= +f.max);
        if (f.inStock) list = list.filter((c) => c.stock > 0);

        if (f.q) {
          const q = f.q.toLowerCase().trim();
          list = list.filter((c) =>
            (c.name + " " + c.brand + " " + catName(c.cat))
              .toLowerCase()
              .includes(q),
          );
        }

        switch (f.sort) {
          case "price-asc":
            list.sort((a, b) => a.price - b.price);
            break;
          case "price-desc":
            list.sort((a, b) => b.price - a.price);
            break;
          case "name":
            list.sort((a, b) => a.name.localeCompare(b.name, "ru"));
            break;
          case "rating":
            list.sort((a, b) => b.rating - a.rating);
            break;
          default:
            list.sort((a, b) => b.rating * b.reviews - a.rating * a.reviews);
        }
        return list;
      }

      /* ============================ КОМПОНЕНТЫ UI ============================= */
      function productCard(c) {
        const fav = state.favorites.includes(c.id);
        return `
  <div class="card">
    <button class="card-fav ${fav ? "on" : ""}" onclick="toggleFav('${c.id}')" title="В избранное">${fav ? "♥" : "♡"}</button>
    <div class="card-img" onclick="openProduct('${c.id}')">${catIcon(c.cat)}</div>
    <div class="card-brand">${esc(c.brand)}</div>
    <div class="card-name" onclick="openProduct('${c.id}')">${esc(c.name)}</div>
    <div class="card-rating">${stars(c.rating)} <i>(${c.reviews})</i></div>
    <div class="card-price">${money(c.price)}</div>
    <div class="card-stock ${c.stock > 0 ? "in-stock" : "no-stock"}">
      ${c.stock > 0 ? "● В наличии (" + c.stock + " шт.)" : "● Нет в наличии"}
    </div>
    <button class="btn btn-primary btn-block" ${c.stock === 0 ? "disabled" : ""}
      onclick="addToCart('${c.id}')">В корзину</button>
  </div>`;
      }

      function toggleFav(id) {
        const i = state.favorites.indexOf(id);
        if (i >= 0) state.favorites.splice(i, 1);
        else state.favorites.push(id);
        saveFav();
        render();
      }

      /* ============================== СТРАНИЦЫ =============================== */

      /* ---------- Главная ---------- */
      function pageHome() {
        const hits = COMPONENTS.slice()
          .sort((a, b) => b.rating * b.reviews - a.rating * a.reviews)
          .slice(0, 8);
        return `
  <section class="page active">
    <div class="hero">
      <h1>Собери свой идеальный ПК</h1>
      <p>Каталог комплектующих с автоматической проверкой совместимости.
         Подбирай детали, сравнивай характеристики и собирай сборку без ошибок.</p>
      <button class="btn btn-primary" data-nav="catalog">Перейти в каталог</button>
      <div class="hero-feats">
        <div class="hero-feat"><div class="ic">🔧</div>
          <div><b>Проверка совместимости</b><small>Сокет, память, мощность БП и форм-фактор</small></div></div>
        <div class="hero-feat"><div class="ic">📦</div>
          <div><b>Более 30 позиций</b><small>Процессоры, видеокарты, память и другое</small></div></div>
        <div class="hero-feat"><div class="ic">💰</div>
          <div><b>Честные цены</b><small>Итоговая стоимость сборки в реальном времени</small></div></div>
      </div>
    </div>

    <h2 class="section-title">Популярные категории</h2>
    <div class="cat-grid">
      ${CATEGORIES.map(
        (c) => `
        <div class="cat-tile" onclick="goCategory('${c.id}')">
          <span class="ic">${c.icon}</span><span>${c.name}</span>
        </div>`,
      ).join("")}
    </div>

    <h2 class="section-title">Хиты продаж
      <a class="link" data-nav="catalog">Все товары →</a></h2>
    <div class="grid">${hits.map(productCard).join("")}</div>
  </section>`;
      }

      /* ---------- Каталог ---------- */
      function pageCatalog() {
        const f = state.filters;
        const list = filtered();

        const brands = [
          ...new Set(
            COMPONENTS.filter(
              (c) => f.cats.length === 0 || f.cats.includes(c.cat),
            ).map((c) => c.brand),
          ),
        ].sort();

        const catCount = (id) => COMPONENTS.filter((c) => c.cat === id).length;

        return `
  <section class="page active">
    <div class="cat-layout">
      <aside class="sidebar">
        <div class="filter-block">
          <div class="filter-title">Категории</div>
          ${CATEGORIES.map(
            (c) => `
            <label class="check">
              <input type="checkbox" ${f.cats.includes(c.id) ? "checked" : ""}
                onchange="toggleFilter('cats','${c.id}')">
              <span>${c.icon} ${c.name}</span>
              <span class="count">${catCount(c.id)}</span>
            </label>`,
          ).join("")}
        </div>

        <div class="filter-block">
          <div class="filter-title">Цена, ₽</div>
          <div class="price-row">
            <input type="number" placeholder="от 1000" value="${f.min ?? ""}"
              onchange="setPrice('min', this.value)">
            <span style="color:var(--muted)">—</span>
            <input type="number" placeholder="до 100000" value="${f.max ?? ""}"
              onchange="setPrice('max', this.value)">
          </div>
        </div>

        <div class="filter-block">
          <div class="filter-title">Бренд</div>
          ${brands
            .map(
              (b) => `
            <label class="check">
              <input type="checkbox" ${f.brands.includes(b) ? "checked" : ""}
                onchange="toggleFilter('brands','${esc(b)}')">
              <span>${esc(b)}</span>
            </label>`,
            )
            .join("")}
        </div>

        <div class="filter-block">
          <div class="filter-title">Наличие</div>
          <label class="check">
            <input type="checkbox" ${f.inStock ? "checked" : ""}
              onchange="toggleFilter('inStock', null)">
            <span>Только в наличии</span>
          </label>
        </div>

        <button class="btn btn-outline btn-block btn-sm" onclick="resetFilters()">Сбросить фильтры</button>
      </aside>

      <div>
        <div class="toolbar">
          <div class="count">Найдено товаров: <b>${list.length}</b>
            ${f.q ? " по запросу «" + esc(f.q) + "»" : ""}</div>
          <select onchange="state.filters.sort=this.value; render()">
            <option value="popular" ${f.sort === "popular" ? "selected" : ""}>Сортировка: Популярные</option>
            <option value="price-asc" ${f.sort === "price-asc" ? "selected" : ""}>Цена: по возрастанию</option>
            <option value="price-desc" ${f.sort === "price-desc" ? "selected" : ""}>Цена: по убыванию</option>
            <option value="rating" ${f.sort === "rating" ? "selected" : ""}>По рейтингу</option>
            <option value="name" ${f.sort === "name" ? "selected" : ""}>По названию</option>
          </select>
        </div>
        ${
          list.length
            ? `<div class="grid">${list.map(productCard).join("")}</div>`
            : `<div class="empty"><div style="font-size:38px;margin-bottom:12px">🔍</div>
               Ничего не найдено. Попробуйте изменить фильтры.</div>`
        }
      </div>
    </div>
  </section>`;
      }

      function toggleFilter(key, val) {
        const f = state.filters;
        if (key === "inStock") {
          f.inStock = !f.inStock;
        } else {
          const arr = f[key];
          const i = arr.indexOf(val);
          if (i >= 0) arr.splice(i, 1);
          else arr.push(val);
        }
        render();
      }
      function setPrice(key, val) {
        state.filters[key] = val === "" ? null : +val;
        render();
      }
      function resetFilters() {
        state.filters = {
          cats: [],
          brands: [],
          min: null,
          max: null,
          inStock: false,
          q: "",
          sort: "popular",
        };
        document.getElementById("globalSearch").value = "";
        render();
      }
      function goCategory(cat) {
        state.filters.cats = [cat];
        state.filters.q = "";
        document.getElementById("globalSearch").value = "";
        go("catalog");
      }

      /* ---------- Страница сборки ---------- */
      const BUILD_SLOTS = [
        { key: "cpu", label: "Процессор" },
        { key: "motherboard", label: "Материнская плата" },
        { key: "gpu", label: "Видеокарта" },
        { key: "ram", label: "Оперативная память" },
        { key: "storage", label: "Накопитель" },
        { key: "psu", label: "Блок питания" },
        { key: "case", label: "Корпус" },
        { key: "cooling", label: "Охлаждение процессора" },
      ];

      function pageBuild() {
        const p = buildParts();
        const issues = checkCompatibility();
        const total = Object.values(p).reduce((s, c) => s + c.price, 0);
        const selectedCount = Object.keys(p).length;

        const slotHtml = BUILD_SLOTS.map((s) => {
          const comp = p[s.key];
          return `
    <div class="slot">
      <div class="slot-ic">${catIcon(s.key)}</div>
      <div class="slot-body">
        <div class="slot-label">${s.label}</div>
        <div class="slot-name ${comp ? "" : "empty-name"}">${comp ? esc(comp.name) : "Компонент не выбран"}</div>
      </div>
      ${
        comp
          ? `<div class="slot-price">${money(comp.price)}</div>
                <button class="btn btn-sm btn-danger" onclick="setBuildPart('${s.key}', null)">Убрать</button>`
          : ""
      }
      <button class="btn btn-sm ${comp ? "btn-outline" : "btn-ghost"}"
        onclick="openPicker('${s.key}')">${comp ? "Заменить" : "Выбрать"}</button>
    </div>`;
        }).join("");

        return `
  <section class="page active">
    <h2 class="section-title">Сборка ПК
      <button class="btn btn-outline btn-sm" onclick="clearBuild()">Сбросить сборку</button>
    </h2>

    <div class="build-layout">
      <div>${slotHtml}</div>

      <div class="summary">
        <div style="font-weight:700;font-size:16px;margin-bottom:12px">Итого</div>
        <div class="summary-row"><span>Выбрано компонентов</span><b>${selectedCount} из ${BUILD_SLOTS.length}</b></div>
        <div class="summary-row"><span>Потребление</span><b>≈ ${totalTdp()} Вт</b></div>
        <div class="summary-row"><span>Рекомендуемый БП</span><b>${recommendedPsu()} Вт</b></div>
        <div class="summary-total"><span>Стоимость</span><b>${money(total)}</b></div>

        ${
          selectedCount === 0
            ? `<div class="compat" style="background:#f2f5fa;color:#4a5164;margin-top:16px">
               Выберите компоненты, чтобы проверить совместимость.</div>`
            : issues.length === 0
              ? `<div class="compat ok">✅ Все выбранные компоненты совместимы.</div>`
              : `<div class="compat bad"><b>⚠ Найдены несовместимости:</b>
                 <ul>${issues.map((i) => `<li>${esc(i)}</li>`).join("")}</ul></div>`
        }

        <div style="display:flex;flex-direction:column;gap:9px;margin-top:18px">
          <button class="btn btn-primary btn-block" ${selectedCount === 0 ? "disabled" : ""}
            onclick="addBuildToCart()">Добавить сборку в корзину</button>
          <button class="btn btn-outline btn-block" ${selectedCount === 0 ? "disabled" : ""}
            onclick="addBuildToCart(true)">Купить в один клик</button>
        </div>
      </div>
    </div>
  </section>`;
      }

      function openPicker(cat) {
        const items = COMPONENTS.filter((c) => c.cat === cat);
        const cur = state.build[cat];

        const rows = items
          .map((c) => {
            const problems = compatibilityOf(cat, c);
            const disabled = problems.length > 0;
            return `
    <div class="picker-row ${disabled ? "disabled" : ""}">
      <div class="ic">${catIcon(cat)}</div>
      <div class="txt">
        <b>${esc(c.name)}</b>
        <small>${esc(c.brand)} · ${shortSpec(c)} ${c.stock === 0 ? "· нет в наличии" : ""}
          ${disabled ? '· <span style="color:#e5484d">' + esc(problems[0]) + "</span>" : ""}</small>
      </div>
      <div class="pr">${money(c.price)}</div>
      <button class="btn btn-sm ${cur === c.id ? "btn-primary" : "btn-outline"}"
        ${disabled || c.stock === 0 ? "disabled" : ""}
        onclick="setBuildPart('${cat}','${c.id}')">${cur === c.id ? "Выбрано" : "Выбрать"}</button>
    </div>`;
          })
          .join("");

        openModal(`
    <h3 style="font-size:20px;font-weight:700">Выбор: ${catName(cat)}</h3>
    <p style="color:var(--muted);font-size:13px;margin-top:6px">
      Несовместимые с уже выбранными компонентами позиции отмечены серым.</p>
    <div class="picker-list">${rows}</div>
  `);
      }

      function compatibilityOf(cat, comp) {
        const p = buildParts();
        const problems = [];

        if (cat === "cpu") {
          if (p.motherboard && p.motherboard.socket !== comp.socket)
            problems.push("не подходит сокет");
          if (p.ram && !comp.ramType.includes(p.ram.ramType))
            problems.push("не поддерживает выбранную память");
          if (p.cooling && !p.cooling.sockets.includes(comp.socket))
            problems.push("кулер не поддерживает сокет");
        }
        if (cat === "motherboard") {
          if (p.cpu && p.cpu.socket !== comp.socket)
            problems.push("сокет не совпадает с процессором");
          if (p.ram && !comp.ramType.includes(p.ram.ramType))
            problems.push("не поддерживает выбранную память");
          if (p.case && !formFactorFits(p.case.formFactor, comp.formFactor))
            problems.push("не помещается в корпус");
        }
        if (cat === "ram") {
          if (p.motherboard && !p.motherboard.ramType.includes(comp.ramType))
            problems.push("не подходит к материнской плате");
          if (p.cpu && !p.cpu.ramType.includes(comp.ramType))
            problems.push("не поддерживается процессором");
        }
        if (cat === "gpu") {
          if (p.case && comp.length > p.case.maxGpu)
            problems.push("слишком длинная для корпуса");
        }
        if (cat === "cooling") {
          if (p.cpu && !comp.sockets.includes(p.cpu.socket))
            problems.push("не поддерживает сокет процессора");
          if (p.cpu && comp.tdp < p.cpu.tdp)
            problems.push("недостаточная мощность охлаждения");
        }
        if (cat === "case") {
          if (
            p.motherboard &&
            !formFactorFits(comp.formFactor, p.motherboard.formFactor)
          )
            problems.push("не подходит форм-фактор платы");
          if (p.gpu && p.gpu.length > comp.maxGpu)
            problems.push("видеокарта не поместится");
        }
        if (cat === "psu") {
          const need = recommendedPsu();
          if (comp.watt < need) problems.push("мощности может не хватить");
        }
        return problems;
      }

      function shortSpec(c) {
        switch (c.cat) {
          case "cpu":
            return `${c.cores} ядер · ${c.socket} · ${c.tdp} Вт`;
          case "gpu":
            return `${c.memory} ГБ ${c.memType} · ${c.tdp} Вт`;
          case "motherboard":
            return `${c.socket} · ${c.ramType.join("/")} · ${c.formFactor}`;
          case "ram":
            return `${c.capacity} ГБ ${c.ramType}-${c.speed}`;
          case "storage":
            return `${c.capacity} ГБ · ${c.stype}`;
          case "psu":
            return `${c.watt} Вт · ${c.cert}`;
          case "case":
            return `${c.formFactor} · до ${c.maxGpu} мм`;
          case "cooling":
            return `${c.ctype} · до ${c.tdp} Вт`;
          default:
            return "";
        }
      }

      function addBuildToCart(buyNow) {
        const p = buildParts();
        const issues = checkCompatibility();
        if (issues.length) {
          toast("Сборка содержит несовместимые компоненты");
          return;
        }
        Object.values(p).forEach((c) => {
          const item = state.cart.find((i) => i.id === c.id);
          if (item) item.qty += 1;
          else state.cart.push({ id: c.id, qty: 1 });
        });
        saveCart();
        updateCartBadge();
        if (buyNow) {
          go("cart");
          toast("Сборка добавлена. Оформите заказ.");
        } else {
          toast("Сборка добавлена в корзину");
        }
      }

      function specLines(c) {
        switch (c.cat) {
          case "cpu":
            return {
              Сокет: c.socket,
              "Ядра / потоки": `${c.cores} / ${c.threads}`,
              "Базовая частота": c.freq + " ГГц",
              TDP: c.tdp + " Вт",
              "Тип памяти": c.ramType.join("/"),
            };
          case "gpu":
            return {
              Видеопамять: c.memory + " ГБ",
              "Тип памяти": c.memType,
              Энергопотребление: c.tdp + " Вт",
              Длина: c.length + " мм",
            };
          case "motherboard":
            return {
              Сокет: c.socket,
              "Тип памяти": c.ramType.join("/"),
              "Форм-фактор": c.formFactor,
            };
          case "ram":
            return {
              Тип: c.ramType,
              Объём: c.capacity + " ГБ",
              Частота: c.speed + " МГц",
              Модулей: c.modules,
            };
          case "storage":
            return {
              Тип: c.stype,
              Объём: c.capacity + " ГБ",
              Интерфейс: c.iface,
              "Скорость чтения": c.read + " МБ/с",
            };
          case "psu":
            return {
              Мощность: c.watt + " Вт",
              Сертификат: c.cert,
              Модульный: c.modular,
            };
          case "case":
            return {
              "Форм-фактор": c.formFactor,
              "Макс. длина GPU": c.maxGpu + " мм",
            };
          case "cooling":
            return {
              Тип: c.ctype,
              "Поддержка сокетов": c.sockets.join(", "),
              "Рассеиваемая мощность": c.tdp + " Вт",
            };
          default:
            return {};
        }
      }

      function addToBuildFromModal(id) {
        const c = byId(id);

          return;

        setBuildPart(c.cat, id);
        toast(`«${c.name}» добавлен в сборку`);
        go("build");

      <div class="err">Пароли не совпадают</div>
    </div>
    <button class="btn btn-primary btn-block" onclick="doRegister()">Зарегистрироваться</button>
    <div class="switch-line">Уже есть аккаунт?
      <a onclick="authMode='login'; render()">Войти</a></div>`;
      }

      function mark(id, ok) {
        const el = document.getElementById(id);
        if (el) el.classList.toggle("invalid", !ok);
        return ok;
      }

      function doLogin() {
        const email = document.getElementById("loginEmail").value.trim();
        const pass = document.getElementById("loginPass").value;

        const okEmail = mark("f-login", email.length > 0);
        const okPass = mark("f-pass", pass.length > 0);
        if (!okEmail || !okPass) return;

        const u = state.users.find(
          (x) =>
            x.email.toLowerCase() === email.toLowerCase() && x.pass === pass,
        );
        if (!u) {
          toast("Неверный email или пароль");
          mark("f-pass", false);
          return;
        }

        state.user = { name: u.name, email: u.email };
        saveUser();
        updateUserLabel();
        toast("Вы вошли в аккаунт");
        render();
      }

      function doRegister() {
        const name = document.getElementById("regName").value.trim();
        const email = document.getElementById("regEmail").value.trim();
        const pass = document.getElementById("regPass").value;
        const pass2 = document.getElementById("regPass2").value;

        const okName = mark("f-name", name.length >= 2);
        const okEmail = mark(
          "f-email",
          /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email),
        );
        const okPass = mark("f-pass1", pass.length >= 6);
        const okPass2 = mark("f-pass2", pass === pass2 && pass2.length > 0);
        if (!(okName && okEmail && okPass && okPass2)) return;

        if (
          state.users.some((u) => u.email.toLowerCase() === email.toLowerCase())
        ) {
          toast("Пользователь с таким email уже существует");
          mark("f-email", false);
          return;
        }

        state.users.push({ name, email, pass });
        saveUsers();
        state.user = { name, email };
        saveUser();
        updateUserLabel();
        toast("Регистрация завершена");
        render();
      }

      function logout() {
        state.user = null;
        saveUser();
        updateUserLabel();
        toast("Вы вышли из аккаунта");
        render();
      }

      function updateUserLabel() {
        document.getElementById("userLabel").textContent = state.user
          ? state.user.name

      }

      /* ============================== РОУТЕР ================================= */
      function go(page) {
        state.page = page;
        window.scrollTo({ top: 0, behavior: "smooth" });
        render();
      }

      function render() {
        const app = document.getElementById("app");
        let html = "";

        switch (state.page) {
          case "home":
            html = pageHome();
            break;
          case "catalog":
            html = pageCatalog();
            break;
          case "build":
            html = pageBuild();
            break;
          case "cart":
            html = pageCart();
            break;
          case "auth":
            html = pageAuth();
            break;
          case "about":
            html = pageAbout();
            break;
          case "blog":
            html = pageBlog();
            break;
          default:
            html = pageHome();
        }
        app.innerHTML = html;

        document.querySelectorAll("#mainNav a").forEach((a) => {
          a.classList.toggle("active", a.dataset.nav === state.page);
        });
        updateCartBadge();
        updateUserLabel();
      }

      /* ------------------------- ГЛОБАЛЬНЫЕ ОБРАБОТЧИКИ ---------------------- */
      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-nav]");
        if (el) {
          go(el.dataset.nav);
        }
      });

      document.getElementById("authBtn").addEventListener("click", () => {
        authMode = state.user ? "login" : "login";
        go("auth");
      });

      document.getElementById("globalSearch").addEventListener("input", (e) => {
        state.filters.q = e.target.value;
        if (state.page !== "catalog") state.page = "catalog";
        render();
        const inp = document.getElementById("globalSearch");
        inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
      });

      /* ------------------------------- СТАРТ --------------------------------- */
      render();
    </script>
